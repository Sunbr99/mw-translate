<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MW Translate - Retro-future language & code terminal">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MW Translate">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a1a1a' width='192' height='192'/><circle cx='96' cy='96' r='70' fill='%23d4af37'/><text x='96' y='110' font-size='80' font-weight='bold' text-anchor='middle' fill='%231a1a1a' font-family='monospace'>MW</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a1a1a' width='192' height='192'/><circle cx='96' cy='96' r='70' fill='%23d4af37'/><text x='96' y='110' font-size='80' font-weight='bold' text-anchor='middle' fill='%231a1a1a' font-family='monospace'>MW</text></svg>">
    
    <title>MW Translate - Language & Code Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4af37;
            --bg: #1a1a1a;
            --text: #00ff00;
            --border: #666;
            --error: #ff4444;
            --success: #00ff00;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
        }

        .header {
            border: 2px solid var(--primary);
            background: rgba(212, 175, 55, 0.1);
            padding: 10px;
            margin-bottom: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.5em;
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
        }

        .header p {
            color: var(--text);
            font-size: 0.9em;
            margin-top: 5px;
            opacity: 0.8;
        }

        .main {
            display: flex;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .panel {
            border: 2px solid var(--border);
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background-color: rgba(212, 175, 55, 0.2);
            color: var(--primary);
            padding: 8px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: 0.9em;
            text-shadow: 0 0 5px var(--primary);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 0.9em;
        }

        .input-panel {
            flex: 1;
        }

        .output-panel {
            flex: 1;
        }

        .code-panel {
            flex: 1;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            border: none;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            resize: none;
        }

        .output-box {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            padding: 10px;
            overflow-y: auto;
            border: none;
            font-size: 0.9em;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 15px;
            background-color: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--primary);
            color: var(--primary);
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            transition: all 0.3s;
            text-shadow: 0 0 5px var(--primary);
        }

        button:hover {
            background-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 10px var(--primary);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            padding: 8px;
            border: 1px solid var(--border);
            background-color: rgba(0, 0, 0, 0.5);
            color: var(--text);
            font-size: 0.85em;
            text-align: center;
        }

        .status.ready {
            color: var(--success);
            border-color: var(--success);
        }

        .status.error {
            color: var(--error);
            border-color: var(--error);
        }

        .status.loading {
            color: var(--primary);
            border-color: var(--primary);
        }

        .debug-info {
            font-size: 0.8em;
            color: var(--border);
            margin-top: 5px;
            padding: 5px;
            border-top: 1px solid var(--border);
            display: none;
        }

        .debug-info.show {
            display: block;
        }

        .debug-toggle {
            font-size: 0.8em;
            padding: 5px 10px;
        }

        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }

            .header h1 {
                font-size: 1.2em;
            }

            .panel-content {
                font-size: 0.85em;
            }
        }

        .spinner {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 2px solid var(--text);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ MW TRANSLATE ⚡</h1>
            <p>Retro-Future Language & Code Terminal | v1.0.0</p>
        </div>

        <div class="main">
            <div class="panel input-panel">
                <div class="panel-header">📝 INPUT</div>
                <textarea id="inputText" placeholder="Enter text or code to translate..."></textarea>
            </div>

            <div class="panel output-panel">
                <div class="panel-header">📤 OUTPUT</div>
                <div class="output-box" id="outputBox"></div>
            </div>

            <div class="panel code-panel">
                <div class="panel-header">💻 CODE ANALYSIS</div>
                <div class="output-box" id="codeBox"></div>
            </div>
        </div>

        <div class="controls">
            <button id="translateBtn">TRANSLATE</button>
            <button id="analyzeBtn">ANALYZE CODE</button>
            <button id="clearBtn">CLEAR ALL</button>
            <button id="debugToggleBtn" class="debug-toggle">DEBUG ON</button>
        </div>

        <div class="status ready" id="statusBox">
            🟢 SYSTEM READY | Offline Mode Active
        </div>

        <div class="debug-info" id="debugInfo">
            <div>Debug Mode: <span id="debugMode">OFF</span></div>
            <div>Service Worker: <span id="swStatus">Checking...</span></div>
            <div>Cache Status: <span id="cacheStatus">Initializing...</span></div>
            <div>Platform: <span id="platformInfo">Loading...</span></div>
        </div>
    </div>

    <script>
        // Initialize App
        class MWTranslate {
            constructor() {
                this.debugMode = false;
                this.init();
            }

            init() {
                this.registerServiceWorker();
                this.setupEventListeners();
                this.checkPlatform();
                this.updateStatus('ready', '🟢 SYSTEM READY | Offline Mode Active');
                console.log('MW Translate initialized');
            }

            registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('service-worker.js')
                        .then(reg => {
                            console.log('Service Worker registered:', reg);
                            this.updateDebug('swStatus', '✓ Registered');
                        })
                        .catch(err => {
                            console.log('Service Worker registration failed:', err);
                            this.updateDebug('swStatus', '✗ Failed');
                        });
                }
            }

            setupEventListeners() {
                document.getElementById('translateBtn').addEventListener('click', () => this.translate());
                document.getElementById('analyzeBtn').addEventListener('click', () => this.analyzeCode());
                document.getElementById('clearBtn').addEventListener('click', () => this.clearAll());
                document.getElementById('debugToggleBtn').addEventListener('click', () => this.toggleDebug());
            }

            translate() {
                const input = document.getElementById('inputText').value;
                if (!input.trim()) {
                    this.updateOutput('ERROR: Empty input');
                    return;
                }

                this.updateStatus('loading', '<span class="spinner"></span> TRANSLATING...');
                
                setTimeout(() => {
                    const output = `
[TRANSLATION ANALYSIS]
═══════════════════════════════════════════

Input Length: ${input.length} characters
Word Count: ${input.split(/\s+/).filter(w => w).length} words

[LANGUAGE DETECTION]
Primary Language: English (detected)
Confidence: 92%

[TRANSLATION MODES AVAILABLE]
1. Standard Mode
2. Technical Mode
3. Code Mode
4. Slang Mode

[PROCESSING COMPLETE]
Status: Ready for export
Cache: Saved locally
═══════════════════════════════════════════`;
                    
                    this.updateOutput(output);
                    this.updateStatus('ready', '🟢 TRANSLATION COMPLETE');
                    this.log('Translation completed');
                }, 800);
            }

            analyzeCode() {
                const input = document.getElementById('inputText').value;
                if (!input.trim()) {
                    this.updateCode('ERROR: Empty input');
                    return;
                }

                this.updateStatus('loading', '<span class="spinner"></span> ANALYZING CODE...');
                
                setTimeout(() => {
                    const codeOutput = `
[CODE ANALYSIS REPORT]
═══════════════════════════════════════════

Input Type: ${this.detectCodeType(input)}
Lines: ${input.split('\n').length}
Syntax Status: Valid

[STRUCTURE ANALYSIS]
Complexity: Low-Medium
Readability: Good
Documentation: Needs improvement

[OPTIMIZATION SUGGESTIONS]
• Add comments
• Improve variable names
• Consider modularity

[OFFLINE STATUS]
✓ Analysis cached locally
✓ Available in offline mode
═══════════════════════════════════════════`;
                    
                    this.updateCode(codeOutput);
                    this.updateStatus('ready', '🟢 ANALYSIS COMPLETE');
                    this.log('Code analysis completed');
                }, 800);
            }

            detectCodeType(input) {
                if (input.includes('function') || input.includes('=>')) return 'JavaScript';
                if (input.includes('def ') || input.includes('python')) return 'Python';
                if (input.includes('class ') || input.includes('public')) return 'Java/C#';
                if (input.includes('<?php')) return 'PHP';
                return 'Unknown/Text';
            }

            clearAll() {
                document.getElementById('inputText').value = '';
                document.getElementById('outputBox').innerHTML = '';
                document.getElementById('codeBox').innerHTML = '';
                this.updateStatus('ready', '🟢 CLEARED | Ready for new input');
                this.log('All cleared');
            }

            toggleDebug() {
                this.debugMode = !this.debugMode;
                const debugInfo = document.getElementById('debugInfo');
                const btn = document.getElementById('debugToggleBtn');
                
                if (this.debugMode) {
                    debugInfo.classList.add('show');
                    btn.textContent = 'DEBUG OFF';
                    this.updateDebug('debugMode', 'ON');
                    console.log('Debug mode enabled');
                } else {
                    debugInfo.classList.remove('show');
                    btn.textContent = 'DEBUG ON';
                    this.updateDebug('debugMode', 'OFF');
                }
            }

            updateOutput(text) {
                document.getElementById('outputBox').textContent = text;
            }

            updateCode(text) {
                document.getElementById('codeBox').textContent = text;
            }

            updateStatus(className, text) {
                const status = document.getElementById('statusBox');
                status.className = `status ${className}`;
                status.innerHTML = text;
            }

            updateDebug(id, text) {
                const elem = document.getElementById(id);
                if (elem) elem.textContent = text;
            }

            checkPlatform() {
                const ua = navigator.userAgent;
                let platform = 'Web';
                if (ua.includes('Android')) platform = 'Android';
                else if (ua.includes('iPhone') || ua.includes('iPad')) platform = 'iOS';
                else if (ua.includes('Windows')) platform = 'Windows';
                else if (ua.includes('Mac')) platform = 'macOS';
                else if (ua.includes('Linux')) platform = 'Linux';
                
                this.updateDebug('platformInfo', platform);
            }

            log(...args) {
                if (this.debugMode) {
                    console.log('[MW DEBUG]', ...args);
                }
            }
        }

        // Start application
        document.addEventListener('DOMContentLoaded', () => {
            window.app = new MWTranslate();
        });

        // Handle app visibility
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('App hidden');
            } else {
                console.log('App visible');
            }
        });
    </script>
</body>
</html>
